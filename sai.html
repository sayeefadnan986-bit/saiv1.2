<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAYEEF ADNAN - AI Chatbot Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #0f172a;
            overflow-x: hidden;
        }
        /* Background Glow Animation */
        .bg-blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            animation: float 10s infinite alternate ease-in-out;
        }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        /* Glassmorphism */
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Typing Dots Animation */
        .dot {
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-white relative">

    <!-- Background Ambient Glows -->
    <div class="bg-blob w-96 h-96 bg-purple-600 rounded-full top-10 left-10 opacity-30"></div>
    <div class="bg-blob w-96 h-96 bg-cyan-600 rounded-full bottom-10 right-10 opacity-30"></div>

    <!-- Header Section -->
    <header class="glass sticky top-0 z-50 px-6 py-4 flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center shadow-md animate-pulse">
                <i class="fa-solid fa-robot text-xl text-white"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wide bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">SAYEEF AI Assistant</h1>
                <p class="text-xs text-slate-400">Powered by Gemini & Created by <span class="text-cyan-400 font-medium">SAYEEF ADNAN</span></p>
            </div>
        </div>
        <div class="hidden sm:flex items-center space-x-2 text-xs bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            <span class="text-slate-300">System Online</span>
        </div>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-between my-auto">
        <div id="chat-box" class="glass rounded-2xl p-4 sm:p-6 h-[65vh] overflow-y-auto flex flex-col space-y-4 shadow-2xl">
            <!-- Welcome Message -->
            <div class="flex items-start space-x-3 max-w-[85%] sm:max-w-[75%] animate-fade-in">
                <div class="w-8 h-8 rounded-full bg-purple-600 flex-shrink-0 flex items-center justify-center text-sm font-bold shadow">AI</div>
                <div class="glass p-4 rounded-2xl rounded-tl-none text-sm text-slate-200 leading-relaxed shadow-md">
                    Hello! I am your advanced AI assistant created by <b class="text-cyan-400">SAYEEF ADNAN</b>. How can I help you today? Ask me anything!
                </div>
            </div>
        </div>

        <!-- Input Form Area -->
        <div class="mt-4">
            <form id="chat-form" class="glass rounded-2xl p-2 flex items-center space-x-2 shadow-xl border border-slate-700/60 focus-within:border-cyan-500 transition-all">
                <input type="text" id="user-input" placeholder="Type your message here, ask SAYEEF's AI..." class="flex-1 bg-transparent px-4 py-3 text-sm text-white focus:outline-none placeholder-slate-400" autocomplete="off" required>
                <button type="submit" id="send-btn" class="bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-600 hover:to-purple-700 text-white px-5 py-3 rounded-xl font-medium text-sm transition-all shadow-lg flex items-center space-x-2 transform active:scale-95">
                    <span>Send</span>
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </form>
        </div>
    </main>

    <!-- Footer Section -->
    <footer class="text-center py-4 text-xs text-slate-500 glass border-t border-slate-800">
        <p>© 2026 Designed & Developed with ❤️ by <span class="text-cyan-400 font-semibold">SAYEEF ADNAN</span>. All Rights Reserved.</p>
    </footer>

    <!-- JavaScript Logic with Gemini API Integration -->
    <script>
        const apiKey = "AQ.Ab8RN6KJYFDH_6Mt6UZ5RYy_KqvkR2MlLwgAW9hvg6ZEgs_NJQ";
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const promptText = userInput.value.trim();
            if (!promptText) return;

            // Append User Message
            appendMessage(promptText, 'user');
            userInput.value = '';
            
            // Show Typing Indicator
            const typingId = showTypingIndicator();

            try {
                // Call Gemini API (v1beta endpoint)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: promptText }]
                        }]
                    })
                });

                const data = await response.json();
                removeTypingIndicator(typingId);

                if (data.candidates && data.candidates.length > 0) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    appendMessage(aiReply, 'ai');
                } else if (data.error) {
                    appendMessage("Error: " + data.error.message, 'ai');
                } else {
                    appendMessage("Sorry, I couldn't process that response. Please check your API key status.", 'ai');
                }
            } catch (error) {
                removeTypingIndicator(typingId);
                appendMessage("Network error occurred! Please check your connection.", 'ai');
            }
        });

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            if (sender === 'user') {
                messageDiv.className = "flex items-start justify-end space-x-3 max-w-[85%] sm:max-w-[75%] ml-auto";
                messageDiv.innerHTML = `
                    <div class="glass p-4 rounded-2xl rounded-tr-none text-sm text-slate-100 bg-cyan-900/40 border-cyan-500/30 leading-relaxed shadow-md">
                        ${escapeHTML(text)}
                    </div>
                    <div class="w-8 h-8 rounded-full bg-cyan-600 flex-shrink-0 flex items-center justify-center text-sm font-bold shadow">You</div>
                `;
            } else {
                messageDiv.className = "flex items-start space-x-3 max-w-[85%] sm:max-w-[75%]";
                messageDiv.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-purple-600 flex-shrink-0 flex items-center justify-center text-sm font-bold shadow">AI</div>
                    <div class="glass p-4 rounded-2xl rounded-tl-none text-sm text-slate-200 leading-relaxed shadow-md">
                        ${formatAIResponse(text)}
                    </div>
                `;
            }
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showTypingIndicator() {
            const id = 'typing-' + Date.now();
            const typingDiv = document.createElement('div');
            typingDiv.id = id;
            typingDiv.className = "flex items-start space-x-3 max-w-[75%]";
            typingDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-purple-600 flex-shrink-0 flex items-center justify-center text-sm font-bold shadow">AI</div>
                <div class="glass p-4 rounded-2xl rounded-tl-none text-sm text-slate-300 flex space-x-1.5 items-center h-10">
                    <div class="w-2 h-2 bg-purple-400 rounded-full dot"></div>
                    <div class="w-2 h-2 bg-purple-400 rounded-full dot"></div>
                    <div class="w-2 h-2 bg-purple-400 rounded-full dot"></div>
                </div>
            `;
            chatBox.appendChild(typingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function formatAIResponse(text) {
            // Simple line break converter for clean text display
            return escapeHTML(text).replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
